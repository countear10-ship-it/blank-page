name = "seasafe-busan-api"
main = "src/index.ts"
compatibility_date = "2026-08-06"

[vars]
ALLOWED_ORIGIN = "https://countear10-ship-it.github.io"
# 활용신청한 해양자동관측망의 실제 OpenAPI 호출 URL을 입력합니다.
MARINE_WATER_API_URL = "https://apis.data.go.kr/1192000/OceansWemoObvpRtmInfoService/OceansWemoObvpRtmInfo"
# 부산 연안 30개 지점의 정기 수질 측정자료입니다. 같은 공공데이터포털 서비스키로 별도 활용신청이 필요합니다.
BUSAN_MARINE_API_URL = "https://apis.data.go.kr/6260000/BusanMrnEnvrnInfoService/getMrnEnvrnInfo"
# 필요하면 식품안전나라 호출 URL 템플릿을 지정합니다. 기본값은 I0490 JSON입니다.
FOOD_SAFETY_KOREA_API_URL = ""
